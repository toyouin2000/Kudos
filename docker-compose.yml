
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: kudos-backend

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api

    container_name: kudos-frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped
